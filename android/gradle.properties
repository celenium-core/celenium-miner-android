# WSL2 box has 8 GB RAM total; the Flutter template default (-Xmx8G, metaspace 4G)
# makes the daemon swap while R8 runs, which turned a 10-minute build into a 45-minute
# one. These numbers keep the whole Gradle/Kotlin toolchain inside RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1G
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
