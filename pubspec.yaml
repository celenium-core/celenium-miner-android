name: celenium_miner
description: "Celenium (CEN) mining control for desktop and Android."
publish_to: 'none'
version: 1.0.5+9005

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino strings plus the generated AppLocalizations delegates.
  # intl is left unpinned: flutter_localizations decides the version.
  flutter_localizations:
    sdk: flutter
  intl: any

  http: ^1.2.2
  shared_preferences: ^2.3.2

  # Wallet: secp256k1 for key derivation, bech32 for the CEN address format,
  # secure storage so a private key never sits in plain SharedPreferences.
  pointycastle: ^3.9.1
  bech32: ^0.2.2
  flutter_secure_storage: ^9.2.2

  # FFI bindings to the precompiled Celenium hashing core
  # (android/app/src/main/jniLibs/*/libcelenium_miner.so).
  ffi: ^2.2.0
  google_mobile_ads: ^9.2.0

  # Keeps the miner hashing in a foreground service so mining survives the app
  # being swiped away or the activity being destroyed in the background.
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Regenerates lib/l10n/app_localizations*.dart from the ARB files on every
  # build; l10n.yaml points the generator at lib/l10n.
  generate: true

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel[wght].ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono[wght].ttf
    - family: Press Start 2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: DSEG14
      fonts:
        - asset: assets/fonts/DSEG14Classic-Regular.ttf
          weight: 400
        - asset: assets/fonts/DSEG14Classic-Bold.ttf
          weight: 700

  assets:
    - assets/wordlists/english.txt
    - assets/logo/cen_mark_on_navy.jpg
    - assets/logo/cen_mark_on_cream.jpg
    - assets/logo/cen_mark_for_dark.png
    - assets/logo/cen_mark_for_light.png
