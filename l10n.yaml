# Generated localizations live next to the ARB files in lib/l10n/.
# The synthetic package (package:flutter_gen) is deprecated and disabled, so
# the app imports the generated file by path: lib/l10n/app_localizations.dart.
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n
nullable-getter: false
